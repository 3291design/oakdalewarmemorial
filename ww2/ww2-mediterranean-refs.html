            <div class="deck" style="font-size: 0.9em; margin-bottom: 15px;">Part IV: Mediterranean, Egypt &amp; Greece</div>
            
            <hr class="main" style="margin: 15px auto; width: 100%;">
    
            <p style="font-size: 0.95em; line-height: 1.6; color: #444; margin-bottom: 20px;">
                The historical narrative and service records for Part IV are drawn from Imperial War Museum campaign archives, Royal Navy Mediterranean Fleet logs, War Office historical records, and Commonwealth War Graves Commission registries. Below is the complete index matching all Part IV citations.
            </p>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                
                <!-- Reference 1 -->
                <div style="border-left: 3px solid #990033; padding-left: 15px; background: #fcfbfa; padding: 10px 15px;">
                    <strong style="font-size: 0.95em; color: #222;">[1] Imperial War Museum (IWM) &ndash; The Mediterranean and Middle East Theatre (1940&ndash;1944)</strong>
                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">
                        Operational overviews covering Allied strategy across North Africa, the Suez Canal corridor, and the Mediterranean basin, including maritime supply routes and regional defence commitments.
                    </p>
                    <a href="https://www.iwm.org.uk/history/second-world-war" target="_blank" rel="noopener" style="font-size: 0.82em; color: #990033; font-weight: bold; text-decoration: none;">Explore IWM History Archive &rarr;</a>
                </div>

                <!-- Reference 2 -->
                <div style="border-left: 3px solid #990033; padding-left: 15px; background: #fcfbfa; padding: 10px 15px;">
                    <strong style="font-size: 0.95em; color: #222;">[2] Commonwealth War Graves Commission (CWGC) &ndash; Egypt, Greece &amp; Mediterranean War Registries</strong>
                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">
                        Official casualty registers, naval memorials, and cemetery records documenting British and Commonwealth servicemen lost at sea and across North Africa, Egypt, and Greece.
                    </p>
                    <a href="https://www.cwgc.org/find-records/find-war-dead/" target="_blank" rel="noopener" style="font-size: 0.82em; color: #990033; font-weight: bold; text-decoration: none;">Search CWGC Casualty Archive &rarr;</a>
                </div>

                <!-- Reference 3 -->
                <div style="border-left: 3px solid #990033; padding-left: 15px; background: #fcfbfa; padding: 10px 15px;">
                    <strong style="font-size: 0.95em; color: #222;">[3] Royal Navy Mediterranean Fleet War Diaries &amp; Convoy Escort Logs (1940&ndash;1944)</strong>
                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">
                        Admiralty records documenting Mediterranean convoy escorts, Malta relief operations, anti-submarine patrols, and naval losses in contested sea lanes.
                    </p>
                    <a href="https://www.nationalarchives.gov.uk/help-with-your-research/research-guides/second-world-war/" target="_blank" rel="noopener" style="font-size: 0.82em; color: #990033; font-weight: bold; text-decoration: none;">View The National Archives (UK) &rarr;</a>
                </div>

                <!-- Reference 4 -->
                <div style="border-left: 3px solid #990033; padding-left: 15px; background: #fcfbfa; padding: 10px 15px;">
                    <strong style="font-size: 0.95em; color: #222;">[4] War Office Historical Section &ndash; Western Desert Campaign &amp; Defence of Egypt (1940&ndash;1944)</strong>
                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">
                        Official military histories detailing land operations, desert logistics, Middle East base depots, and garrison duties across Egypt and North Africa.
                    </p>
                    <a href="https://www.nationalarchives.gov.uk/help-with-your-research/research-guides/second-world-war/" target="_blank" rel="noopener" style="font-size: 0.82em; color: #990033; font-weight: bold; text-decoration: none;">View The National Archives (UK) &rarr;</a>
                </div>

                <!-- Reference 5 -->
                <div style="border-left: 3px solid #990033; padding-left: 15px; background: #fcfbfa; padding: 10px 15px;">
                    <strong style="font-size: 0.95em; color: #222;">[5] Imperial War Museum (IWM) &ndash; The Campaign in Greece and Crete (1941)</strong>
                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">
                        Historical accounts and archival records covering the 1941 Allied expeditionary deployment to Greece, mountain rearguard actions, and the evacuations to Crete and Egypt.
                    </p>
                    <a href="https://www.iwm.org.uk/history/second-world-war" target="_blank" rel="noopener" style="font-size: 0.82em; color: #990033; font-weight: bold; text-decoration: none;">Explore IWM History Archive &rarr;</a>
                </div>

                <!-- Reference 6 -->
                <div style="border-left: 3px solid #990033; padding-left: 15px; background: #fcfbfa; padding: 10px 15px;">
                    <strong style="font-size: 0.95em; color: #222;">[6] Imperial War Museum (IWM) &ndash; British Intervention in Greece &amp; The Greek Civil War (1944&ndash;1946)</strong>
                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">
                        Historical accounts and archival records covering the German withdrawal from Greece, the December 1944 Athens uprising (<em>Dekemvriana</em>), and the subsequent British stabilisation deployment during the outbreak of the Greek Civil War.
                    </p>
                    <a href="https://www.iwm.org.uk/history/the-british-intervention-in-greece-1944-1945" target="_blank" rel="noopener" style="font-size: 0.82em; color: #990033; font-weight: bold; text-decoration: none;">Explore IWM History Archive &rarr;</a>
                </div>

                <div style="border-left: 3px solid #990033; padding-left: 15px; background: #fcfbfa; padding: 10px 15px;">

                    <p style="font-size: 0.88em; line-height: 1.5; color: #555; margin: 4px 0 6px 0;">

                    </p>
                    <a href="https://www.cwgc.org/" target="_blank" rel="noopener" style="font-size: 0.82em; color: #990033; font-weight: bold; text-decoration: none;">Search CWGC Casualty Archive &rarr;</a>
